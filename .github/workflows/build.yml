name: build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 没有依赖需要安装：构建与测试只用 Node 内置模块。
      - name: 重新生成内嵌资源
        run: node tools/embed-assets.mjs

      - name: 校验 client.js 与源码同步
        run: node tools/build.mjs --check

      - name: 语法检查
        run: node --check client.js

      - name: 无头加载测试
        run: node tools/smoke-test.mjs
